<VirtualHost *:80>
   ServerName cantine-mcp.gaubey.com
   ProxyRequests Off
   ProxyPass / http://127.0.0.1:8787/ timeout=600
   ProxyPassReverse / http://127.0.0.1:8787/
   ProxyPreserveHost On
RewriteEngine on
RewriteCond %{SERVER_NAME} =cantine-mcp.gaubey.com
RewriteRule ^ https://%{SERVER_NAME}%{REQUEST_URI} [END,NE,R=permanent]
</VirtualHost>
