<IfModule mod_ssl.c>
<VirtualHost *:443>
   ServerName cantine-mcp.gaubey.com
   ProxyRequests Off
   ProxyPass / http://127.0.0.1:8787/ timeout=600
   ProxyPassReverse / http://127.0.0.1:8787/
   ProxyPreserveHost On
   # Le serveur construit ses URL OAuth à partir de BASE_URL, pas des en-têtes : rien d'autre à transmettre.
Include /etc/letsencrypt/options-ssl-apache.conf
SSLCertificateFile /etc/letsencrypt/live/gaubey.com/fullchain.pem
SSLCertificateKeyFile /etc/letsencrypt/live/gaubey.com/privkey.pem
</VirtualHost>
</IfModule>
